    <script>
      (function () {
        var root = document.getElementById("root");
        if (!root || !window.MutationObserver) return;
        var scheduled = false;
        function syncTitle() {
          scheduled = false;
          var heading = document.querySelector("#main h1");
          var name = heading && heading.textContent.replace(/\s+/g, " ").trim();
          var next = name ? name + " · Learning Lab" : "Learning Lab";
          if (document.title !== next) document.title = next;
        }
        function queue() {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(syncTitle);
        }
        new MutationObserver(queue).observe(root, { subtree: true, childList: true, characterData: true });
        window.addEventListener("hashchange", queue);
      })();
